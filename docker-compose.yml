services:
  auth:
    build: .
    command: node services/auth/index.js
    environment:
      PORT: ${AUTH_PORT}
      MONGO_URI: ${AUTH_MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${AUTH_PORT}:${AUTH_PORT}"

  preferences:
    build: .
    command: node services/preferences/index.js
    environment:
      PORT: ${PREFERENCES_PORT}
      JWT_SECRET: ${JWT_SECRET}
      MYSQL_HOST: mysql
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${PREFERENCES_PORT}:${PREFERENCES_PORT}"

  weather-air:
    build: .
    command: node services/weather-air/index.js
    environment:
      PORT: ${WEATHER_AIR_PORT}
      WEATHER_AIR_USE_MOCK: ${WEATHER_AIR_USE_MOCK}
      WEATHER_AIR_API_URL: ${WEATHER_AIR_API_URL}
      WEATHER_AIR_API_KEY: ${WEATHER_AIR_API_KEY}
      UNSPLASH_API_URL: ${UNSPLASH_API_URL}
      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY}
    ports:
      - "${WEATHER_AIR_PORT}:${WEATHER_AIR_PORT}"

  weather-water:
    build: .
    command: node services/weather-water/index.js
    environment:
      PORT: ${WEATHER_WATER_PORT}
      WEATHER_WATER_USE_MOCK: ${WEATHER_WATER_USE_MOCK}
      WEATHER_WATER_API_URL: ${WEATHER_WATER_API_URL}
      WEATHER_WATER_API_KEY: ${WEATHER_WATER_API_KEY}
      UNSPLASH_API_URL: ${UNSPLASH_API_URL}
      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY}
    ports:
      - "${WEATHER_WATER_PORT}:${WEATHER_WATER_PORT}"

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: ${AUTH_MONGO_DB}
      MONGO_INITDB_ROOT_USERNAME: ${AUTH_MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${AUTH_MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
      - ./services/auth/mongo-init:/docker-entrypoint-initdb.d
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./services/preferences/sql/init:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  mongo_data:
  mysql_data:
