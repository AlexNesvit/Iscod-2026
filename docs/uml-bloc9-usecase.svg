  <ellipse cx="860" cy="500" rx="170" ry="48" class="use"/>
  <text x="773" y="507" class="small">Supprimer un favori</text>

  <line x1="185" y1="190" x2="340" y2="220" class="line"/>
  <line x1="185" y1="198" x2="690" y2="220" class="line"/>
  <line x1="185" y1="205" x2="340" y2="360" class="line"/>
  <line x1="185" y1="212" x2="690" y2="360" class="line"/>
  <line x1="185" y1="220" x2="340" y2="500" class="line"/>
  <line x1="185" y1="228" x2="690" y2="500" class="line"/>
